[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[project]
# TODO(rename): your package's name, description and author.
name = "my-satellite"
version = "0.2.0"
description = "A Nestor satellite."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Your Name" }]
requires-python = ">=3.12"
dependencies = [
    # The SDK, with audio over WebRTC (voice) and the machine's microphone and speaker (PortAudio).
    "nestor-satellite[voice,sounddevice]>=0.5,<0.6",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
    "Typing :: Typed",
]

[project.scripts]
my-satellite = "my_satellite.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.4",
    "ty==0.0.99",
]

[tool.uv.build-backend]
module-name = "my_satellite"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
markers = ["conformance: the Nestor server's conformance suite, through uvx (`pytest -m conformance`)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ty.environment]
python-version = "3.12"
